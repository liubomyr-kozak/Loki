name: Release

# Builds the downloadable desktop app for Windows and macOS and, on a version
# tag, publishes it as a GitHub Release. Every installer carries its own
# Node.js runtime (scripts/bundle-node-runtime.js), so the person downloading
# it needs nothing else installed to start Loki.
#
#   git tag v1.0.0 && git push origin v1.0.0
#
# The tag must match the version in package.json. Actions → Release → Run
# workflow with "publish" ticked does the same without pushing a tag (it
# tags the commit itself). Pull requests that touch
# the release pipeline and manual runs without "publish" only build;
# the installers are attached to the run as artifacts instead.
#
# Nothing is code-signed: wiki/guides/troubleshooting.md covers what Gatekeeper and
# SmartScreen show the first time.

on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - .github/workflows/release.yml
      - scripts/bundle-node-runtime.js
      - app/src-tauri/tauri.conf.json
  workflow_dispatch:
    inputs:
      publish:
        description: Publish a release tagged v<package.json version> from this commit
        type: boolean
        default: false

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

jobs:
  build:
    name: build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple Silicon
            os: macos-latest
            target: aarch64-apple-darwin
            bundles: dmg
          - name: macOS Intel
            os: macos-latest
            target: x86_64-apple-darwin
            bundles: dmg
          - name: Windows x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri -> target
          key: ${{ matrix.target }}

      - name: Check tag matches package.json
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match package.json version ${version} (expected v${version})"
            exit 1
          fi

      - name: Install
        run: yarn install --immutable

      - name: Build installer
        # "-" asks for an ad-hoc signature over the whole .app. It is not a
        # Developer ID, but without it a downloaded app on Apple Silicon is
        # reported as "damaged" instead of "unidentified developer".
        env:
          APPLE_SIGNING_IDENTITY: ${{ runner.os == 'macOS' && '-' || '' }}
        run: yarn tauri build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}

      - name: Collect installer
        shell: bash
        run: |
          mkdir -p out
          bundle="app/src-tauri/target/${{ matrix.target }}/release/bundle"
          find "$bundle" -maxdepth 2 \( -name '*.dmg' -o -name '*-setup.exe' \) -exec cp {} out/ \;
          ls -la out
          test -n "$(ls out)"

      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.target }}
          path: out/*
          if-no-files-found: error
          retention-days: 14

  publish:
    name: publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/') || inputs.publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: out
          pattern: installer-*
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la out
          # A tag push names the release; a manual run tags this commit
          # with the package.json version.
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            tag="$GITHUB_REF_NAME"
          else
            tag="v$(node -p "require('./package.json').version")"
          fi
          gh release create "$tag" out/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Loki $tag" \
            --generate-notes \
            --notes "Download the file for your system: \`.dmg\` for macOS (aarch64 = Apple Silicon M1/M2/M3/M4, x64 = Intel), \`-setup.exe\` for Windows. The apps are not code-signed; see https://github.com/liubomyr-kozak/Loki/blob/main/wiki/guides/troubleshooting.md if macOS or Windows blocks the first launch."
